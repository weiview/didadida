name = "didadida-api"
main = "src/index.ts"
compatibility_date = "2024-05-29"

# [vars]
# MY_VARIABLE = "production_value"

[vars]
# 軌跡貼路（map matching）用的 Valhalla 實例。FOSSGIS e.V.（OSM 德國分會）
# 提供的公開服務，免 API key，條款允許私人使用、每秒最多 1 個請求。
# 放在設定而非程式碼裡是條款的明文要求 —— 清空這一行就等於關掉這個功能。
VALHALLA_URL = "https://valhalla1.openstreetmap.de"

[[d1_databases]]
binding = "DB"
database_name = "didadida-db"
database_id = "0ca8abc0-936e-4f15-892b-e998de168d5d" # 請替換為您的 D1 資料庫 ID

[[r2_buckets]]
binding = "BUCKET"
bucket_name = "didadida-photos"
preview_bucket_name = "didadida-photos-preview"

[env.dev]
name = "didadida-api-dev"
[env.dev.vars]
VALHALLA_URL = "https://valhalla1.openstreetmap.de"

# dev 使用獨立的 D1，與 production 完整切開（2026-07-27）
[[env.dev.d1_databases]]
binding = "DB"
database_name = "didadida-db-dev"
database_id = "609aac06-672b-4594-a102-99d078724684"

# dev 使用獨立的 R2，與 production 完整切開（2026-07-27）
[[env.dev.r2_buckets]]
binding = "BUCKET"
bucket_name = "didadida-photos-dev"
preview_bucket_name = "didadida-photos-preview"
